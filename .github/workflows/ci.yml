name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-format:
    name: commit format (dependency-free commitlint equivalent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Conventional Commits format
        env:
          # A force-push or a brand-new branch reports an all-zero "before" sha,
          # and a deleted branch reports an all-zero "after": neither names a
          # usable range, so the range resolution below falls back to the single
          # head commit rather than diffing against a sha git does not have.
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Regex pattern: type(scope)?: subject (matches release.sh)
          pattern='^[a-z]+(\([^)]*\))?!?:'

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            range="$base..$head"
          else
            head="${{ github.sha }}"
            # Zeroes, empty, or a sha absent from this clone (force-push
            # rewrote it) all mean "no reliable predecessor": check the tip only.
            if [ -z "$PUSH_BEFORE" ] ||
               [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] ||
               ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              range="$head~1..$head"
              # A root commit has no parent, so even that range is invalid.
              git rev-parse --verify --quiet "$head~1" >/dev/null || range="$head"
            else
              range="$PUSH_BEFORE..$head"
            fi
          fi

          # Get all commits in the range, excluding merge commits
          if [ "$range" = "$head" ]; then
            commits=$(git log --no-merges --format='%H %s' -1 "$head")
          else
            commits=$(git log --no-merges --format='%H %s' "$range")
          fi

          echo "Checking range: $range"

          if [ -z "$commits" ]; then
            echo "No commits found in range $range"
            exit 0
          fi

          failed=0
          # IFS must stay at a space: an empty IFS disables field splitting, so
          # commit_hash would swallow the whole "<sha> <subject>" line and every
          # commit would be checked against an empty subject.
          while IFS=' ' read -r commit_hash subject; do
            if ! echo "$subject" | grep -qE "$pattern"; then
              echo "::error::Commit $commit_hash violates Conventional Commits: '$subject'"
              failed=1
            fi
          done <<< "$commits"

          if [ $failed -eq 1 ]; then
            echo ""
            echo "All commits must follow Conventional Commits format:"
            echo "  type(scope)?: description"
            echo ""
            echo "Valid types: feat, fix, docs, chore, test, refactor, build, perf, ci, style"
            exit 1
          fi

  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor is the go.mod minimum; "stable" is the latest release, which is
        # also what release.yml builds shipped binaries with (security patches).
        go: ["1.26", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Build (default, cgo-free)
        run: CGO_ENABLED=0 go build ./...
      - name: Build (embed tag, cgo-free)
        run: CGO_ENABLED=0 go build -tags embed ./...
      - name: Vet
        run: go vet ./...
      - name: Test + coverage gate (total + per-package, >= 80%)
        run: make cover
      - name: Benchmarks (smoke, 1x)
        run: go test -run='^$' -bench=. -benchmem -benchtime=1x ./...

  lint:
    name: lint + vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Not `stable`: the pinned golangci-lint's staticcheck must understand
          # this toolchain's stdlib; a newer Go panics it (Go 1.27 broke v2.12.2).
          # Probe `stable` in the test matrix; keep go.mod on the latest patch.
          go-version-file: go.mod
      - name: Verify modules
        run: go mod verify
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
